# XcodeGen spec – Nina.xcodeproj is generated (`make generate`) and never committed.
# Identifiers, team and versions come from Config/Base.xcconfig. Entitlements are handwritten files
# wired through CODE_SIGN_ENTITLEMENTS – never XcodeGen's `entitlements:` key (it regenerates them).
name: Nina
options:
  deploymentTarget:
    iOS: "26.0"
    macOS: "26.0"
    watchOS: "26.0"
  developmentLanguage: en
  createIntermediateGroups: true
  groupSortPosition: top

configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig

settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    ENABLE_PREVIEWS: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    DEAD_CODE_STRIPPING: YES
    GENERATE_INFOPLIST_FILE: NO
  configs:
    Debug:
      APS_ENVIRONMENT: development
    Release:
      APS_ENVIRONMENT: production

packages:
  BinisoftKit:
    path: Vendor/BinisoftKit
  NinaCore:
    path: Packages/NinaCore

# One source tree (App/Sources + Shared) for iPhone/iPad and Mac. The watch app shares Shared/;
# the widgets and complications only the snapshot bridge, rings and formatting.
targets:
  Nina:
    type: application
    platform: iOS
    sources:
      - path: App/Sources
      - path: App/Resources
      - path: Shared
    dependencies:
      - package: NinaCore
      - package: BinisoftKit
        product: BinisoftKit
      - target: NinaWatch
      - target: NinaWidgets
    settings:
      base:
        PRODUCT_NAME: Nina
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID)
        INFOPLIST_FILE: Config/iOS/Info.plist
        CODE_SIGN_ENTITLEMENTS: Config/iOS/Nina.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
    scheme:
      testTargets: []

  # Mac app: same sources and bundle ID (universal purchase), its own Info.plist and entitlements.
  NinaMac:
    type: application
    platform: macOS
    sources:
      - path: App/Sources
      - path: App/Resources
      - path: Shared
    dependencies:
      - package: NinaCore
      - package: BinisoftKit
        product: BinisoftKit
    settings:
      base:
        PRODUCT_NAME: Nina
        PRODUCT_MODULE_NAME: Nina
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID)
        INFOPLIST_FILE: Config/macOS/Info.plist
        CODE_SIGN_ENTITLEMENTS: Config/macOS/Nina.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_HARDENED_RUNTIME: YES
        COMBINE_HIDPI_IMAGES: YES
    scheme:
      testTargets: []

  # Apple Watch app, embedded in the iOS app. Syncs on its own through the app's iCloud container
  # and carries the complications.
  NinaWatch:
    type: application
    platform: watchOS
    sources:
      - path: Watch/Sources
      - path: Watch/Resources
      - path: Shared
    dependencies:
      - package: NinaCore
      - package: BinisoftKit
        product: BinisoftKit
      - target: NinaWatchWidgets
    settings:
      base:
        PRODUCT_NAME: NinaWatch
        PRODUCT_BUNDLE_IDENTIFIER: $(WATCH_BUNDLE_ID)
        INFOPLIST_FILE: Config/watchOS/Info.plist
        CODE_SIGN_ENTITLEMENTS: Config/watchOS/NinaWatch.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "4"
        SKIP_INSTALL: YES
    scheme:
      testTargets: []

  # Home and Lock Screen widgets. They read a small snapshot from the shared App Group.
  NinaWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Widgets/Sources
      - path: Widgets/Resources
      - path: Shared/Store/WidgetBridge.swift
      - path: Shared/AppInfo.swift
      - path: Shared/Format.swift
      - path: Shared/UI
    dependencies:
      - package: NinaCore
      - package: BinisoftKit
        product: BinisoftKitCore
    settings:
      base:
        PRODUCT_NAME: NinaWidgets
        PRODUCT_BUNDLE_IDENTIFIER: $(WIDGETS_BUNDLE_ID)
        INFOPLIST_FILE: Config/Widgets/Info.plist
        CODE_SIGN_ENTITLEMENTS: Config/Widgets/NinaWidgets.entitlements
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        SKIP_INSTALL: YES

  # Watch complications: the same widget source, on the watch's own App Group snapshot.
  NinaWatchWidgets:
    type: app-extension
    platform: watchOS
    sources:
      - path: Widgets/Sources
      - path: Widgets/Resources
      - path: Shared/Store/WidgetBridge.swift
      - path: Shared/AppInfo.swift
      - path: Shared/Format.swift
      - path: Shared/UI
    dependencies:
      - package: NinaCore
      - package: BinisoftKit
        product: BinisoftKitCore
    settings:
      base:
        PRODUCT_NAME: NinaWatchWidgets
        PRODUCT_BUNDLE_IDENTIFIER: $(WATCH_WIDGETS_BUNDLE_ID)
        INFOPLIST_FILE: Config/WatchWidgets/Info.plist
        CODE_SIGN_ENTITLEMENTS: Config/WatchWidgets/NinaWatchWidgets.entitlements
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "4"
        SKIP_INSTALL: YES
