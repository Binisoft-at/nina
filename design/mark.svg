<svg xmlns="http://www.w3.org/2000/svg" viewBox="112 96 800 800" width="800" height="800">
  <!-- Nina mark: the icon glyph alone on a transparent background, for use inside the app. -->
  <defs>
    <linearGradient id="ring" gradientUnits="userSpaceOnUse" x1="281.42" y1="362.52" x2="662.5" y2="816.67">
      <stop offset="0" stop-color="#CBEB45"/>
      <stop offset="0.45" stop-color="#95DC35"/>
      <stop offset="1" stop-color="#1FAA55"/>
    </linearGradient>
    <linearGradient id="leafLight" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="-250">
      <stop offset="0" stop-color="#27BC66"/>
      <stop offset="1" stop-color="#73E6A1"/>
    </linearGradient>
    <linearGradient id="leafShade" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="-250">
      <stop offset="0" stop-color="#0F9150"/>
      <stop offset="1" stop-color="#3FCF7E"/>
    </linearGradient>
    <!-- Glass: soft lift below, a crisp specular rim on edges facing the light (top left),
         a wide inner glow, and a gentle shade on edges facing away. -->
    <filter id="glass" filterUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="10"/>
      <feOffset dy="8" result="lift"/>
      <feFlood flood-color="#0B3B26" flood-opacity="0.3"/>
      <feComposite in2="lift" operator="in" result="drop"/>
      <feOffset in="SourceAlpha" dx="4" dy="6" result="o1"/>
      <feComposite in="SourceAlpha" in2="o1" operator="out"/>
      <feGaussianBlur stdDeviation="1.8"/>
      <feComposite in2="SourceAlpha" operator="in" result="rim"/>
      <feFlood flood-color="#FFFFFF" flood-opacity="0.45"/>
      <feComposite in2="rim" operator="in" result="specular"/>
      <feOffset in="SourceAlpha" dx="16" dy="22" result="o2"/>
      <feComposite in="SourceAlpha" in2="o2" operator="out"/>
      <feGaussianBlur stdDeviation="14"/>
      <feComposite in2="SourceAlpha" operator="in" result="band"/>
      <feFlood flood-color="#FFFFFF" flood-opacity="0.15"/>
      <feComposite in2="band" operator="in" result="glow"/>
      <feOffset in="SourceAlpha" dx="-12" dy="-16" result="o3"/>
      <feComposite in="SourceAlpha" in2="o3" operator="out"/>
      <feGaussianBlur stdDeviation="12"/>
      <feComposite in2="SourceAlpha" operator="in" result="far"/>
      <feFlood flood-color="#00331A" flood-opacity="0.3"/>
      <feComposite in2="far" operator="in" result="shade"/>
      <feMerge>
        <feMergeNode in="drop"/>
        <feMergeNode in="SourceGraphic"/>
        <feMergeNode in="shade"/>
        <feMergeNode in="glow"/>
        <feMergeNode in="specular"/>
      </feMerge>
    </filter>
  </defs>
  <!-- leaf: two halves (sunlit / shaded) of a pointed leaf, tucked behind the ring's end cap -->
  <g filter="url(#glass)">
    <g transform="translate(447.94 319.57) rotate(44)">
      <path d="M 0 0 A 140.8 140.8 0 0 1 0 -250 Z" fill="url(#leafLight)"/>
      <path d="M 0 0 A 140.8 140.8 0 0 0 0 -250 Z" fill="url(#leafShade)"/>
    </g>
  </g>
  <!-- ring: centre (512, 556), radius 234, 134 thick, open from -20 to 46 deg (82 % closed) -->
  <g filter="url(#glass)">
    <path d="M 680.33 393.45 A 234 234 0 1 1 431.97 336.11" fill="none" stroke="url(#ring)" stroke-width="134" stroke-linecap="round"/>
  </g>
</svg>
